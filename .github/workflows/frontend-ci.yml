name: Frontend CI

# Chamado pelo ci-gate.yml (workflow_call), que decide quando o frontend é exigido. Não tem filtro de caminhos nem roda por
# conta própria em push ou pull request: o gate sempre roda e é quem exige (ou dispensa) esta verificação.
# O workflow_dispatch só serve para depurar este arquivo isolado.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Auditoria de pacotes: qualquer severidade, dependências de desenvolvimento incluídas. Sem acesso ao registro o
      # comando também falha (a verificação nunca passa em silêncio).
      - name: Audit dependencies
        run: npm audit

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify security headers
        run: bash scripts/verify-security-headers.sh
