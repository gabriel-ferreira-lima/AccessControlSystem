name: Backend CI

# Chamado pelo ci-gate.yml (workflow_call), que decide quando o backend é exigido. Não tem filtro de caminhos nem roda por
# conta própria em push ou pull request: o gate sempre roda e é quem exige (ou dispensa) esta verificação.
# O workflow_dispatch só serve para depurar este arquivo isolado.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Auditoria de pacotes (NuGet Audit, Directory.Build.props): vulnerabilidade conhecida, direta ou transitiva, falha
      # aqui. O CI=true do Actions também torna erro a falha de consulta aos avisos (NU1900).
      - name: Restore and audit packages
        run: dotnet restore Backend.slnx

      - name: Build with dotnet
        run: dotnet build Backend.slnx --configuration Release

      - name: Run tests
        run: dotnet test Backend.slnx --configuration Release --no-build

      - name: Publish package
        run: dotnet publish AccessControlSystem.Api/AccessControlSystem.Api.csproj --configuration Release

      - name: Publish Migrator
        run: dotnet publish AccessControlSystem.Migrator/AccessControlSystem.Migrator.csproj --configuration Release
