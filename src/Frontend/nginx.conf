# Cabeçalhos de segurança (spec security-perimeter; contracts/security-headers.md). Regras de manutenção deste arquivo:
#  1. Todo "location" que declara add_header próprio DEVE repetir o include do trecho de cabeçalhos: o nginx NÃO herda os
#     add_header do server quando o location tem algum.
#  2. Todo add_header de segurança leva "always" (senão 404 e 5xx saem sem o cabeçalho).
#  3. Cabeçalho novo que a Api também possa enviar entra na lista de proxy_hide_header do /v1/.
# O teste src/lib/security-headers.test.ts e o scripts/verify-security-headers.sh travam essas regras.

# HSTS de 1 ano só quando o acesso original foi HTTPS (o load balancer informa em X-Forwarded-Proto). Valor vazio => o
# nginx não envia o cabeçalho (HTTP simples, como no ambiente local). A origem do cabeçalho não é verificada: o navegador
# ignora HSTS recebido por HTTP, e em produção o console só é alcançável pelo load balancer (spec de ambientes).
map $http_x_forwarded_proto $hsts_value {
    default  "";
    "https"  "max-age=31536000";
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # Assets com hash no nome: cache agressivo.
    location /assets/ {
        expires    1y;
        add_header  Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;   # este location tem add_header próprio: repete o include
        try_files   $uri =404;
    }

    # API: encaminha para o container do backend (mesma origem -> sem CORS).
    location /v1/ {
        # Os cabeçalhos de segurança são do console (herdados do server). Se a Api enviar algum deles, o nginx o esconde
        # para a resposta não sair com o cabeçalho duplicado.
        proxy_hide_header  Content-Security-Policy;
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Referrer-Policy;
        proxy_hide_header  Permissions-Policy;
        proxy_hide_header  Strict-Transport-Security;

        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do client-side (React Router) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
