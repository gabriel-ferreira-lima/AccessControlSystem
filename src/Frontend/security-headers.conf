# Cabeçalhos de segurança do console (spec security-perimeter, contracts/security-headers.md).
# Incluído pelo nginx.conf no server e em todo location que declara add_header próprio (o nginx não herda add_header do
# server quando o location tem algum). Todos com "always", para saírem também em 404 e 5xx.
#
# COMO RECALCULAR O HASH DO SCRIPT DO TEMA: se o <script> escrito no index.html mudar, rode "npm test" em src/Frontend.
# O teste src/lib/security-headers.test.ts falha dizendo o 'sha256-...' correto; cole-o no script-src abaixo. O hash é o
# do texto do script com quebras de linha em LF (o navegador normaliza CRLF para LF antes de calcular).
#
# Sem 'unsafe-inline', sem upgrade-insecure-requests (quebraria o ambiente local em HTTP) e sem includeSubDomains/preload
# no HSTS. A Permissions-Policy desliga recursos que o console não usa (a spec do QR code revisa a câmera, se precisar).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LCCOtOeSV5GyKyN+fZtxwcse+Xt1THJGu2Z2jTmIrX0='; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS de 1 ano só quando o acesso original foi HTTPS (map $hsts_value do nginx.conf); vazio em HTTP simples, e o nginx
# não envia o cabeçalho quando o valor é vazio.
add_header Strict-Transport-Security $hsts_value always;
