# Upstream simulado da Api para a verificação dos cabeçalhos do console (verify-security-headers.sh).
# Responde em qualquer rota e envia DE PROPÓSITO um cabeçalho do conjunto de segurança: o console tem de escondê-lo
# (proxy_hide_header) para a resposta encaminhada não sair com o cabeçalho duplicado.
server {
    listen 8080;

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/json;
        return 200 '{"stub":true}';
    }
}
